<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Offline | BPS Canteen</title>
    <style>
        /* Minimalist inline styling to ensure it works without external CSS files */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #09090b; /* bg-background */
            color: #fafafa; /* text-foreground */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            text-align: center;
            padding: 24px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.025em; }
        p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .icon { margin-bottom: 24px; opacity: 0.5; }
        button {
            background-color: #fafafa;
            color: #09090b;
            border: none;
            padding: 12px 24px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" x2="22" y1="2" y2="22"></line>
            <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
            <path d="M5 13a10 10 0 0 1 5.5-2.5"></path>
            <path d="M2 8.5a15 15 0 0 1 10.5-3.5"></path>
        </svg>
        <h1>System Offline</h1>
        <p>The Canteen App cannot reach the main server. Please reconnect to the network to process transactions.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
